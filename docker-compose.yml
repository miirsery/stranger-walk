# Бэкенд (Rust) + PostgreSQL. Запуск: docker compose up --build
# Значения по умолчанию подходят для локальной разработки; свои задаются в .env (см. .env.example).
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stranger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stranger}
      POSTGRES_DB: ${POSTGRES_DB:-stranger_walk}
    volumes:
      # Начиная с PostgreSQL 18 образ хранит данные в /var/lib/postgresql/<версия>.
      - db-data:/var/lib/postgresql
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-stranger}:${POSTGRES_PASSWORD:-stranger}@db:5432/${POSTGRES_DB:-stranger_walk}
      LISTEN_ADDR: 0.0.0.0:8080
    ports:
      - '127.0.0.1:${BACKEND_PORT:-8080}:8080'
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
